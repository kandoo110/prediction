<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WLF Prediction Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #080b10;
            --card-bg: rgba(15, 22, 36, 0.95);
            --accent-yellow: #ffd700;
            --accent-blue: #0057b7;
            --green: #2ed573;
            --red: #ff4757;
            --text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 6px 8px;
            box-sizing: border-box;
            user-select: none;
            overflow-x: hidden;
        }

        .header { text-align: center; margin-bottom: 6px; }
        .header h3 { color: var(--accent-yellow); margin: 2px 0; font-size: 18px; text-shadow: 0 0 12px rgba(255, 215, 0, 0.3); }

        .dashboard-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .dash-card {
            background: linear-gradient(135deg, rgba(0, 87, 183, 0.35), rgba(255, 215, 0, 0.12));
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 12px;
            padding: 6px;
            text-align: center;
        }

        .dash-title { font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
        .dash-value { font-size: 13px; font-weight: 800; color: var(--accent-yellow); }

        .wallet-btn-wrapper { margin-bottom: 6px; display: flex; justify-content: center; }
        #ton-connect-button { width: 100%; display: flex; justify-content: center; }

        .action-btns-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .btn-deposit-crypto { background: linear-gradient(135deg, #0057b7, #003d82); border: 1px solid rgba(255,215,0,0.3); }
        .btn-deposit-football { background: linear-gradient(135deg, #2ed573, #10ac84); }
        .btn-action:active { transform: scale(0.97); }

        .tabs-wrapper {
            background: linear-gradient(135deg, #0057b7, #ffd700);
            padding: 1.5px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .tabs { display: flex; background: #0f1624; border-radius: 11px; padding: 2px; }
        .tab-btn {
            flex: 1; padding: 7px; border: none; background: transparent; color: #8e9aaf;
            font-weight: bold; font-size: 11px; border-radius: 9px; cursor: pointer; transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #0057b7, #003d82);
            color: #ffffff;
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card-wrapper {
            background: linear-gradient(135deg, #0057b7 0%, rgba(0, 87, 183, 0.3) 50%, #ffd700 100%);
            padding: 1.5px; border-radius: 14px; margin-bottom: 8px;
        }
        .crypto-card, .match-card { background: var(--card-bg); border-radius: 13px; padding: 10px; }
        .crypto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .crypto-title { font-size: 14px; font-weight: bold; color: #ffffff; }
        .crypto-price { font-size: 14px; font-weight: 800; color: var(--accent-yellow); }

        .prediction-controls { display: flex; gap: 8px; margin-top: 8px; }
        .btn-predict {
            flex: 1; padding: 8px; border: none; border-radius: 10px; font-size: 12px;
            font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .btn-up { background: linear-gradient(135deg, #2ed573, #10ac84); }
        .btn-down { background: linear-gradient(135deg, #ff4757, #ff3838); }

        .match-time {
            font-size: 11px; color: var(--accent-yellow); margin-bottom: 6px; display: inline-block;
            background: rgba(255, 215, 0, 0.12); padding: 3px 8px; border-radius: 8px; font-weight: bold;
        }
        .teams-container { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 800; color: #ffffff; }
        .vs { font-size: 11px; color: #94a3b8; background: rgba(255,255,255,0.06); padding: 4px 8px; border-radius: 8px; }
        .football-options { display: flex; gap: 6px; margin-top: 8px; }
        .btn-option {
            flex: 1; padding: 9px 2px; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2); color: white; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .fee-badge { font-size: 10px; color: #94a3b8; text-align: center; margin-top: 6px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <h3>⚡ WLF Prediction Arena</h3>
    </div>

    <div class="dashboard-bar">
        <div class="dash-card">
            <div class="dash-title">💰 موجودی بازی</div>
            <div class="dash-value" id="user-balance">500 WLF</div>
        </div>
        <div class="dash-card">
            <div class="dash-title">💵 قابل برداشت</div>
            <div class="dash-value" id="user-claimable">0 WLF</div>
        </div>
    </div>

    <div class="dashboard-bar">
        <div class="dash-card">
            <div class="dash-title">📈 استخر کریپتو</div>
            <div class="dash-value" id="crypto-pool">1,250 WLF</div>
        </div>
        <div class="dash-card">
            <div class="dash-title">⚽ استخر فوتبال</div>
            <div class="dash-value" id="football-pool">2,500 WLF</div>
        </div>
    </div>

    <div class="wallet-btn-wrapper">
        <div id="ton-connect-button"></div>
    </div>

    <div class="action-btns-grid">
        <button class="btn-action btn-deposit-crypto" onclick="depositToCryptoPool()">📥 شارژ استخر کریپتو</button>
        <button class="btn-action btn-deposit-football" onclick="depositToFootballPool()">📥 شارژ استخر فوتبال</button>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('crypto')">📈 کریپتو (سریع)</button>
            <button class="tab-btn" onclick="switchTab('football')">⚽ مسابقات فوتبال</button>
        </div>
    </div>

    <!-- تب کریپتو -->
    <div id="crypto-tab" class="tab-content active">
        <div class="card-wrapper">
            <div class="crypto-card">
                <div class="crypto-header">
                    <div class="crypto-title">🪙 Bitcoin (BTC)</div>
                    <div class="crypto-price" id="btc-price">در حال دریافت...</div>
                </div>
                <div style="font-size: 11px; color: #94a3b8;">پیش‌بینی ۵ دقیقه‌ای قیمت</div>
                <div class="prediction-controls">
                    <button class="btn-predict btn-up" onclick="makeCryptoBet('BTC', 'UP', 50)">🟢 صعودی</button>
                    <button class="btn-predict btn-down" onclick="makeCryptoBet('BTC', 'DOWN', 50)">🔴 نزولی</button>
                </div>
                <div class="fee-badge">ورودی: ۵۰ توکن WLF$</div>
            </div>
        </div>
    </div>

    <!-- تب فوتبال -->
    <div id="football-tab" class="tab-content">
        <div id="football-matches-container">
            <div class="card-wrapper">
                <div class="match-card">
                    <div class="match-time">⏱️ امشب - ساعت ۲۲:۳۰</div>
                    <div class="teams-container">
                        <span>🔵 رئال مادرید</span>
                        <span class="vs">VS</span>
                        <span>🔴 بارسلونا</span>
                    </div>
                    <div class="football-options">
                        <button class="btn-option" onclick="makeFootballBet('Match1', 'HOME', 500)">برد میزبان</button>
                        <button class="btn-option" onclick="makeFootballBet('Match1', 'DRAW', 500)">مساوی</button>
                        <button class="btn-option" onclick="makeFootballBet('Match1', 'AWAY', 500)">برد میهمان</button>
                    </div>
                    <div class="fee-badge">ورودی: ۵۰۰ WLF | واریز به استخر فوتبال</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://prediction-ldxa.onrender.com/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        let userBalance = 500;

        function updateUI() {
            document.getElementById('user-balance').innerText = userBalance.toLocaleString() + " WLF";
        }
        updateUI();

        // آدرس‌های اختصاصی استخرهای شما
        const CRYPTO_POOL_WALLET = "UQCeHlHUwoFhVcLQoJMXOvtcDskkrN1g4q6NVvdFimwp3Hnz";
        const FOOTBALL_POOL_WALLET = "UQAD8y_EPRPmbDwK_e1pXXq9hCKpfNx8JWvUyqh5xB22k42H";

        // تابع واریز به استخر کریپتو
        async function depositToCryptoPool() {
            if (!tonConnectUI.connected) {
                alert("لطفاً ابتدا کیف پول خود را متصل کنید!");
                return;
            }

            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [
                        {
                            address: CRYPTO_POOL_WALLET,
                            amount: "5000000" // کارمزد جزئی شبکه (پرداخت از ولت کاربر)
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                userBalance += 1000;
                updateUI();
                alert("تراکنش موفق! استخر کریپتو با موفقیت شارژ شد.");
            } catch (e) {
                console.error(e);
                alert("تراکنش توسط کاربر لغو شد یا با خطا مواجه گردید.");
            }
        }

        // تابع واریز به استخر فوتبال
        async function depositToFootballPool() {
            if (!tonConnectUI.connected) {
                alert("لطفاً ابتدا کیف پول خود را متصل کنید!");
                return;
            }

            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [
                        {
                            address: FOOTBALL_POOL_WALLET,
                            amount: "5000000"
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                userBalance += 2000;
                updateUI();
                alert("تراکنش موفق! استخر فوتبال با موفقیت شارژ شد.");
            } catch (e) {
                console.error(e);
                alert("تراکنش توسط کاربر لغو شد یا با خطا مواجه گردید.");
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'crypto') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('crypto-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('football-tab').classList.add('active');
            }
        }

        async function fetchCryptoPrices() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,theopennetwork,solana,binancecoin&vs_currencies=usd');
                const data = await response.json();
                if (data.bitcoin) document.getElementById('btc-price').innerText = '$' + data.bitcoin.usd.toLocaleString();
            } catch (e) {
                console.error(e);
            }
        }
        fetchCryptoPrices();

        function makeCryptoBet(symbol, direction, fee) {
            if (!tonConnectUI.connected) { alert("لطفاً ولت را متصل کنید!"); return; }
            if (userBalance < fee) { alert("موجودی کافی نیست!"); return; }
            userBalance -= fee;
            updateUI();
            alert(`پیش‌بینی کریپتو ثبت شد و ${fee} WLF کسر گردید.`);
        }

        function makeFootballBet(matchId, choice, fee) {
            if (!tonConnectUI.connected) { alert("لطفاً ولت را متصل کنید!"); return; }
            if (userBalance < fee) { alert("موجودی کافی نیست!"); return; }
            userBalance -= fee;
            updateUI();
            alert(`پیش‌بینی مسابقه فوتبال ثبت شد.`);
        }
    </script>
</body>
</html>
